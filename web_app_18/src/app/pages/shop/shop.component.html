<div class="grid grid-cols-4 gap-4 p-2">
  <div
    *ngFor="let item of items$ | async"
    class="flex flex-col rounded bg-white p-2 gap-2"
  >
    <div>
      <p class="">{{ item.name }}</p>
      <p class="text-gray-500 text-xs">{{ item.description }}</p>
    </div>
    <div class="flex justify-between">
      <div class="flex flex-col">
        <p class="text-gray-500 text-xs">{{ item.price }}€</p>
        <p *ngIf="item.quantity > 1" class="text-green-500 text-xs">In Stock</p>
      </div>
      <button class="self-end" (click)="addItemToCart(item)">
        <fa-icon [icon]="faCartPlus"></fa-icon>
      </button>
    </div>
  </div>
</div>
